<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand bg-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">MyStore</a>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="#">Cart</a>
    </div>
</nav>
<div class="container mt-4 product-listing">
    <h2>Our Products</h2>
    <div class="category-filter">
        <input type="radio" name="category" id="all" checked>
        <label for="all">All</label>
        <input type="radio" name="category" id="electronics">
        <label for="electronics">Electronics</label>
        <input type="radio" name="category" id="fashion">
        <label for="fashion">Fashion</label>
        <input type="radio" name="category" id="accessories">
        <label for="accessories">Accessories</label>
        <input type="radio" name="category" id="home">
        <label for="home">Home & Living</label>
    </div>

<div class="search-box mb-3">
    <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Search products..."
    >
</div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 product-grid">
        <div class="col product-item" data-category="accessories">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Watch">
                </a>
                <h5>Watch</h5>
                <p>Rs. 2500</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="fashion">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Shoes">
                </a>
                <h5>Shoes</h5>
                <p>Rs. 3500</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="electronics">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">
                </a>
                <h5>Headphones</h5>
                <p>Rs. 4000</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="electronics">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400" alt="Camera">
                </a>
                <h5>Camera</h5>
                <p>Rs. 8000</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="accessories">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400" alt="Handbag">
                </a>
                <h5>Handbag</h5>
                <p>Rs. 3000</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="fashion">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400" alt="Sunglasses">
                </a>
                <h5>Sunglasses</h5>
                <p>Rs. 1200</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="fashion">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" alt="T-Shirt">
                </a>
                <h5>T-Shirt</h5>
                <p>Rs. 1000</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
        <div class="col product-item" data-category="home">
            <div class="card p-2">
                <a href="product.html">
                    <img class="w-100" src="https://images.unsplash.com/photo-1503602642458-232111445657?w=400" alt="Chair">
                </a>
                <h5>Chair</h5>
                <p>Rs. 5000</p>
                <button class="btn btn-dark">Add to Cart</button>
            </div>
        </div>
    </div>
     <p id="noProducts" hidden>No products found</p>
</div>
<footer class="bg-light text-center p-3 mt-4">
    MyStore | Contact: info@mystore.com
</footer>
<script src="script.js"></script>
</body>
</html>
